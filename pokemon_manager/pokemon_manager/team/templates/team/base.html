<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Менеджер команды Pokémon{% endblock %}</title>
  <style>
    :root { --bg:#2b2d2f; --card:#383b3e; --text:#f1f1f1; --muted:#a9adb1; --accent:#f5c518; --danger:#e5534b; --ok:#4cae6a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header { background:#1f2022; padding:12px 24px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
    header .brand { font-weight:700; font-size:1.2rem; color:var(--accent); }
    header nav { display:flex; gap:16px; flex:1; }
    header form { display:flex; gap:6px; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    h1 { margin-top:0; }
    input, select, button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid #555; background:#222; color:var(--text); }
    button { cursor:pointer; background:var(--accent); color:#222; border:none; font-weight:600; }
    button.danger { background:var(--danger); color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
    .card { background:var(--card); border-radius:10px; padding:16px; }
    .card img { width:120px; height:120px; object-fit:contain; float:right; }
    .card h2 { margin:0 0 4px; text-transform:capitalize; }
    .badge { display:inline-block; background:#555; border-radius:999px; padding:2px 10px; margin:2px 4px 2px 0; font-size:.8rem; text-transform:capitalize; }
    .muted { color:var(--muted); }
    .stat { display:grid; grid-template-columns:110px 36px 1fr; gap:8px; align-items:center; font-size:.9rem; margin:3px 0; }
    progress { width:100%; height:8px; border:none; border-radius:4px; background:#222; overflow:hidden; appearance:none; -webkit-appearance:none; }
    progress::-webkit-progress-bar { background:#222; border-radius:4px; }
    progress::-webkit-progress-value { background:var(--accent); border-radius:4px; }
    progress::-moz-progress-bar { background:var(--accent); border-radius:4px; }
    .actions { display:flex; gap:8px; margin-top:12px; clear:both; align-items:center; }
    .messages { list-style:none; padding:0; margin:0 0 16px; }
    .messages li { padding:10px 14px; border-radius:6px; margin-bottom:6px; background:#444; }
    .messages .success { background:#1f4d30; } .messages .error { background:#5c2420; } .messages .warning { background:#5a4a14; }
    .inline-form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    .vs { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .log li { margin:4px 0; }
    .winner { font-size:1.4rem; color:var(--accent); text-transform:capitalize; }
    table { border-collapse:collapse; } td, th { padding:4px 12px 4px 0; text-align:left; }
  </style>
</head>
<body>
  <header>
    <span class="brand">⚡ Pokémon Team</span>
    <nav>
      <a href="{% url 'team:list' %}">Моя команда</a>
      <a href="{% url 'team:battle' %}">Тренировочный бой</a>
    </nav>
    <form action="{% url 'team:search' %}" method="get">
      <input type="search" name="q" placeholder="Найти покемона по имени" value="{{ query|default:'' }}">
      <button type="submit">Найти</button>
    </form>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
