<div class="stat"><span>HP</span><b>{{ p.hp }}</b><progress value="{{ p.hp }}" max="255"></progress></div>
<div class="stat"><span>Атака</span><b>{{ p.attack }}</b><progress value="{{ p.attack }}" max="255"></progress></div>
<div class="stat"><span>Защита</span><b>{{ p.defense }}</b><progress value="{{ p.defense }}" max="255"></progress></div>
<div class="stat"><span>Спец. атака</span><b>{{ p.special_attack }}</b><progress value="{{ p.special_attack }}" max="255"></progress></div>
<div class="stat"><span>Спец. защита</span><b>{{ p.special_defense }}</b><progress value="{{ p.special_defense }}" max="255"></progress></div>
<div class="stat"><span>Скорость</span><b>{{ p.speed }}</b><progress value="{{ p.speed }}" max="255"></progress></div>
